<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>QuishGuard AI</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <h1>🛡️ QuishGuard AI</h1>
    <p class="sub">Zero-Day QR and UPI Defense</p>
    <div class="stats">
      <div><b id="scans">0</b><span>Scans</span></div>
      <div><b id="threats">0</b><span>Threats</span></div>
    </div>
    <textarea
      id="payload"
      rows="4"
      placeholder="Paste URL or UPI string here...">
    </textarea>
    <input
      id="context"
      placeholder="Optional: text on sign e.g. Scan to RECEIVE Rs.5000" />
    <button id="scanBtn">Scan with AI</button>
    <div id="out" class="out hidden"></div>
    <p class="foot">Backend: localhost:8000 | Manifest V3</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
